name: Release

on:
  release:
    types: [published]

env:
  PYTHONUTF8: 1

permissions:
  contents: read
  id-token: write

jobs:
  hooks:
    name: Check Release Commit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check the Release Commit
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME"

  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: hooks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One entry per interpreter variant. A `cp314-*` glob stops before the `t`, so a flat list
        # silently ships zero free-threaded wheels while looking complete.
        python-version: ["312", "313", "314", "314t"]
        os:
          [
            ubuntu-26.04,
            ubuntu-26.04-arm,
            macos-26,
            windows-2025,
            windows-11-arm,
          ]
        exclude:
          # No free-threaded ARM64 interpreter ships for Windows, so the pair would build nothing.
          - { os: windows-11-arm, python-version: "314t" }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_ARCHS_WINDOWS: ${{ matrix.os == 'windows-11-arm' && 'ARM64' || 'AMD64 x86' }}
          CIBW_TEST_GROUPS: test
          CIBW_TEST_COMMAND: pytest {project}/test/ -x -q

      # An empty wheelhouse must not pass for a release. The ABI tag is the discriminator:
      # matching the Python tag alone lets a free-threaded wheel masquerade as the GIL one.
      - name: Assert the Expected Interpreter Was Built
        shell: bash
        run: |
          count=$(ls wheelhouse/*.whl | grep -c -- "-cp${{ matrix.python-version }}-") || true
          ls -la wheelhouse/
          echo "wheels carrying ABI tag cp${{ matrix.python-version }}: ${count}"
          test "$count" -gt 0

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.os }}-cp${{ matrix.python-version }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source Distribution
    needs: hooks
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build Source Distribution
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      # The extension compiles against headers no `Extension` entry lists as a source, so a sdist
      # that omits them installs nowhere.
      - name: Assert the Headers Travel
        shell: bash
        run: |
          count=$(tar tzf dist/*.tar.gz | grep -c "include/smashtable/.*\.hpp")
          echo "headers carried by the source distribution: ${count}"
          test "$count" -gt 0

      - name: Upload Source Distribution
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_python:
    name: Publish Python
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-26.04
    environment:
      name: pypi
      url: https://pypi.org/p/smashtable
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "{cibw-*,sdist}"
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

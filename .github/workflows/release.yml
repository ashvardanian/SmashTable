name: Release

on:
  push:
    branches: ["main"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1

permissions:
  contents: write
  id-token: write

jobs:

  versioning:
    name: Update Version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            pyproject.toml:^version = "(\d+\.\d+\.\d+)"
            setup.py:version="(\d+\.\d+\.\d+)"
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+)
            python/module.cpp:"__version__", "(\d+\.\d+\.\d+)"
          dry-run: "false"
          push: "true"
          create-release: "true"
          github-token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}

  rebase:
    name: Rebase Dev Branch
    needs: versioning
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Perform Rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main-dev
          git rebase origin/main
      - name: Push Changes
        uses: CasperWA/push-protected@v2
        with:
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
          branch: main-dev
          unprotect_reviews: True
          force: True

  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: versioning
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One entry per interpreter variant. A `cp314-*` glob stops before the `t`, so a flat list
        # silently ships zero free-threaded wheels while looking complete.
        python-version: ["312", "313", "314", "314t"]
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_BUILD: cp${{ matrix.python-version }}-*
          CIBW_TEST_GROUPS: test
          CIBW_TEST_COMMAND: pytest {project}/test/ -x -q

      # An empty wheelhouse must not pass for a release. The ABI tag is the discriminator:
      # matching the Python tag alone lets a free-threaded wheel masquerade as the GIL one.
      - name: Assert the Expected Interpreter Was Built
        shell: bash
        run: |
          count=$(ls wheelhouse/*.whl | grep -c -- "-cp${{ matrix.python-version }}-") || true
          ls -la wheelhouse/
          echo "wheels carrying ABI tag cp${{ matrix.python-version }}: ${count}"
          test "$count" -gt 0

      - name: Upload Wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-${{ matrix.os }}-cp${{ matrix.python-version }}
          path: wheelhouse/*.whl

  publish_python:
    name: Publish Python
    needs: build_wheels
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/smashtable
    permissions:
      id-token: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          verbose: true
          print-hash: true

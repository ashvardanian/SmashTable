name: Test Python

on:
  workflow_call:

env:
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

permissions:
  contents: read

jobs:
  test_python:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
      - name: Build and Install
        run: python -m pip install .

      # A free-threaded build that re-enables the GIL on import ships the label without the
      # property, so fail loudly rather than regress quietly to a serialized interpreter.
      - name: Assert the GIL Stays Disabled
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c "import sys, smashtable; assert not sys._is_gil_enabled(), 'importing smashtable re-enabled the GIL'"

      # Exercising a free-threaded build single-threaded proves nothing about it.
      - name: Test
        run: python -X faulthandler -m pytest -x ${{ endsWith(matrix.python-version, 't') && '--parallel-threads=4 --iterations=2' || '' }}

  # The native Python builds fail in minutes, before the cibuildwheel jobs start.
  wheels:
    name: Build Python Wheels
    needs: test_python
    uses: ./.github/workflows/build-wheels.yml
    with:
      smoke: true

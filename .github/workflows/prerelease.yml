name: Pre-Release

on:
  push:
    branches: ["main"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]
  pull_request:
    branches: ["main*"]
    paths-ignore: ["**/*.md", "LICENSE", ".gitignore", "assets/**"]

env:
  GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
  PYTHONUTF8: 1
  PYTHONFAULTHANDLER: 1

permissions:
  contents: read

# One group per source branch: `push` covers `main` and a request covers every `main*` branch, so a
# branch with an open request is built once. Superseded request runs cancel; `main` runs finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versioning:
    name: Update Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run TinySemVer
        uses: ashvardanian/tinysemver@v3
        with:
          verbose: "true"
          version-file: "VERSION"
          update-version-in: |
            Cargo.toml:^version = "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
            CMakeLists.txt:VERSION (\d+\.\d+\.\d+(?:-rc\.\d+)?)
            python/module.cpp:"__version__", "(\d+\.\d+\.\d+(?:-rc\.\d+)?)"
          update-major-version-in: |
            include/smashtable/shared.hpp:^#define SMASHTABLE_VERSION_MAJOR (\d+)
          update-minor-version-in: |
            include/smashtable/shared.hpp:^#define SMASHTABLE_VERSION_MINOR (\d+)
          update-patch-version-in: |
            include/smashtable/shared.hpp:^#define SMASHTABLE_VERSION_PATCH (\d+)
          dry-run: "true"

  # Gates everything below. A header that compiles only after a sibling was included is a latent
  # break for any consumer who includes it alone, and for us on whichever wheel architecture
  # happens to order its includes differently. Two standard libraries, since libstdc++ and libc++
  # disagree about what each header transitively pulls in.
  test_headers:
    name: Compile Headers Standalone with ${{ matrix.compiler }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: g++-14, package: g++-14 }
          - { compiler: clang++-18, package: clang-18 }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }}
      - name: Compile Each Header Alone
        run: |
          failed=""
          for header in include/smashtable/*.hpp; do
            relative="${header#include/}"
            printf '#include <%s>\nint main() { return 0; }\n' "$relative" \
              | ${{ matrix.compiler }} -std=c++20 -fsyntax-only -Wall -Wextra -Iinclude -x c++ - 2> /dev/null \
              && echo "ok   $relative" \
              || { echo "::error file=$header::$relative does not compile standalone"; failed="$failed $relative"; }
          done
          for relative in $failed; do
            echo "::group::$relative"
            printf '#include <%s>\nint main() { return 0; }\n' "$relative" \
              | ${{ matrix.compiler }} -std=c++20 -fsyntax-only -Iinclude -x c++ - || true
            echo "::endgroup::"
          done
          test -z "$failed"

  verify_models:
    name: Check Promela models and GenMC clients
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Spin, Clang and the GenMC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y spin cmake clang-20 llvm-20-dev libffi-dev zlib1g-dev libedit-dev
      - name: Checkout GenMC
        uses: actions/checkout@v7
        with:
          repository: MPI-SWS/genmc
          ref: 9f6c4c0772d0c42b325681581acc6a0f3eb9b5f7
          path: genmc
      - name: Restore the GenMC build
        id: genmc
        uses: actions/cache@v6
        with:
          path: genmc/build
          key: genmc-9f6c4c0-clang-20
      - name: Build GenMC
        if: steps.genmc.outputs.cache-hit != 'true'
        run: |
          cmake -S genmc -B genmc/build -D CMAKE_BUILD_TYPE=Release -D CMAKE_C_COMPILER=clang-20 -D CMAKE_CXX_COMPILER=clang++-20 -D LLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build genmc/build --parallel
      - name: Check the models and the clients
        run: verification/check.sh
        env:
          GENMC: ${{ github.workspace }}/genmc/build/bin/genmc
          GENMC_CLANG: clang++-20

  test_ubuntu:
    name: ${{ matrix.name }}
    needs: test_headers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Test on Ubuntu with GCC 14", cc: gcc-14, cxx: g++-14, package: g++-14, preset: release }
          - { name: "Test on Ubuntu with Clang 18", cc: clang-18, cxx: clang++-18, package: clang-18, preset: release }
          - { name: "Test on Ubuntu with Sanitizers", cc: gcc-14, cxx: g++-14, package: g++-14, preset: asan }
          # The hash table's lock-free slot protocol is the only concurrent code in the tree, and
          # a data race in it is invisible to the address and behaviour sanitizers.
          - { name: "Test on Ubuntu with Thread Sanitizer", cc: gcc-14, cxx: g++-14, package: g++-14, preset: tsan }
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.package }}

      # Heavy template instantiation is bounded by memory, not cores. One job per core on a small
      # runner gets a compiler killed by the OOM killer, which reports nothing itself.
      - name: Choose Build Parallelism
        run: |
          available_kb=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)
          jobs=$((available_kb / (2 * 1024 * 1024)))
          cores=$(nproc)
          [ "$jobs" -lt 1 ] && jobs=1
          [ "$jobs" -gt "$cores" ] && jobs=$cores
          echo "available $((available_kb / 1024)) MB, cores $cores, using -j$jobs"
          echo "BUILD_JOBS=$jobs" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -D CMAKE_C_COMPILER=${{ matrix.cc }} -D CMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel ${{ env.BUILD_JOBS }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Run the Example
        run: ./build_${{ matrix.preset }}/smashtable_example

  # A hosted runner has no GPU, so this job proves the device code compiles and that the test's own
  # skip path works - it reports no device and exits zero rather than failing. The default architecture
  # list needs no device to detect.
  test_cuda:
    name: Build CUDA Backend on Ubuntu
    needs: test_headers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The family codes like `100f` need CMake 3.31, and Ubuntu 24.04 ships 3.28.
      - name: Install Toolchain
        run: |
          apt-get update && apt-get install -y ninja-build g++ python3-pip curl gnupg
          pip install --break-system-packages "cmake>=3.31"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-22
      - name: Log Toolchain
        run: |
          nvcc --version
          nvidia-smi || echo "no GPU on this runner, which is what the skip path is for"

      - name: Configure
        run: cmake --preset cuda -D CMAKE_C_COMPILER="$CC" -D CMAKE_CXX_COMPILER="$CXX" -D CMAKE_CUDA_HOST_COMPILER="$CXX"
      # Two jobs, not one per core: nvcc runs a host and a device pass over the same template-heavy
      # headers, and the pair is bounded by memory rather than by cores.
      - name: Build
        run: cmake --build --preset cuda --parallel 2
      - name: Test
        # Only the CUDA suite: the nine CPU tests here are the same ones the GCC 14 row just ran.
        run: ctest --preset cuda

  # Each machine profile builds the tests and the CUDA test for one CPU and one GPU code; the Arm ones build natively
  # on Arm runners, where the CUDA image also exists. Clang 22 compiles the host units, as GCC 13 predates Olympus.
  build_machine_profile:
    name: Build Machine Profile ${{ matrix.preset }}
    needs: test_headers
    runs-on: ${{ contains(fromJSON('["grace_hopper", "vera_rubin"]'), matrix.preset) && 'ubuntu-24.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 30
    container: nvidia/cuda:13.4.3-devel-ubuntu26.04
    strategy:
      fail-fast: false
      matrix:
        preset: [xeon4_hopper, xeon6_blackwell, venice_mi450, grace_hopper, vera_rubin]
    env:
      CC: clang-22
      CXX: clang++-22
    steps:
      - name: Install Toolchain
        run: |
          apt-get update && apt-get install -y ninja-build g++ git python3-pip curl gnupg
          pip install --break-system-packages "cmake>=3.31"
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] http://apt.llvm.org/resolute/ llvm-toolchain-resolute-22 main" \
            > /etc/apt/sources.list.d/llvm.list
          apt-get update && apt-get install -y clang-22
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }} -D CMAKE_C_COMPILER="$CC" -D CMAKE_CXX_COMPILER="$CXX" -D CMAKE_CUDA_HOST_COMPILER="$CXX"
          cmake --build --preset ${{ matrix.preset }} --parallel 2

  test_32bit:
    name: Test on Linux 32-bit i386
    needs: test_headers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # `-m32` targets the i386 ABI, which the runner executes natively - no container and no
      # emulator. What it buys: a pointer and a `std::size_t` half the assumed width, and a 64-bit
      # integer aligned to 4 rather than 8, which is what `atomic_ref` needs and cannot get here.
      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - name: Configure
        run: cmake --preset linux_i386
      - name: Build
        run: cmake --build --preset linux_i386
      - name: Test
        run: ctest --preset linux_i386

  test_macos:
    name: Test on macOS with AppleClang
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build --preset release
      - name: Test
        run: ctest --preset release

  test_windows:
    name: Test on Windows with MSVC
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset msvc2026_x64
      - name: Build
        run: cmake --build --preset msvc2026_x64 --parallel
      - name: Test
        run: ctest --preset msvc2026_x64

  test_windows_arm64:
    name: Test on Windows ARM64 with MSVC
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset msvc2022_arm64
      - name: Build
        run: cmake --build --preset msvc2022_arm64 --parallel
      - name: Test
        run: ctest --preset msvc2022_arm64

  # The NDK's own toolchain, compile only: no hosted runner executes Android binaries.
  build_android:
    name: Build for Android ARM64
    needs: test_headers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: cmake --preset android_arm64
      - name: Build
        run: cmake --build --preset android_arm64 --parallel 2

  # Compile only: the threaded suites need a shared memory the single-threaded module lacks.
  build_wasm:
    name: Build for WebAssembly with ${{ matrix.preset }}
    needs: test_headers
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [wasm32_emscripten, wasm64_emscripten]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v16
      - name: Build
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }} --parallel 2

  test_python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
        python-version: ["3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group test
      - name: Build and Install
        run: python -m pip install .

      # A free-threaded build that re-enables the GIL on import ships the label without the
      # property, so fail loudly rather than regress quietly to a serialized interpreter.
      - name: Assert the GIL Stays Disabled
        if: ${{ endsWith(matrix.python-version, 't') }}
        run: python -c "import sys, smashtable; assert not sys._is_gil_enabled(), 'importing smashtable re-enabled the GIL'"

      # Exercising a free-threaded build single-threaded proves nothing about it.
      - name: Test
        shell: bash
        run: |
          if [[ "${{ matrix.python-version }}" == *t ]]; then
            python -X faulthandler -m pytest -x --parallel-threads=4 --iterations=2
          else
            python -X faulthandler -m pytest -x
          fi

  # A smoke subset only. The full matrix runs on release, where an unbuildable wheel is fatal.
  build_wheels:
    name: Wheels ${{ matrix.os }} cp${{ matrix.python-version }}
    needs: test_headers
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15]
        python-version: ["312", "315t"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build Wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          # One entry per interpreter variant: a `cp314-*` glob stops before the `t`, so a flat
          # list silently ships zero free-threaded wheels while looking complete.
          CIBW_BUILD: cp${{ matrix.python-version }}-*
      - name: Assert the Expected Interpreter Was Built
        shell: bash
        run: |
          # The ABI tag is the discriminator: matching the Python tag alone lets a free-threaded
          # wheel masquerade as the GIL one.
          count=$(ls wheelhouse/*.whl | grep -c -- "-cp${{ matrix.python-version }}-") || true
          ls -la wheelhouse/
          echo "wheels carrying ABI tag cp${{ matrix.python-version }}: ${count}"
          test "$count" -gt 0

  build_docs:
    name: Build Docs
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Doxygen
        run: |
          curl -sSfL https://www.doxygen.nl/files/doxygen-1.18.0.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
      - name: Install Sphinx
        run: pip install -r docs/requirements.txt
      - name: Install SmashTable from the Checkout
        run: pip install .
      - name: Build Docs
        run: cd docs && doxygen conf.dox && sphinx-build -M html . ../build/docs -W

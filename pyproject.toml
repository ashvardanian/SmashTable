[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "smashtable"
dynamic = ["version"]
description = "Transactions across Associative Containers"
readme = "README.md"
authors = [{ name = "Ash Vardanian" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"

[tool.scikit-build]
build.targets = ["smashtable_python"]
build-dir = "build_python/{wheel_tag}"
install.components = ["smashtable_python"]
wheel.packages = []

[tool.scikit-build.cmake.define]
SMASHTABLE_BUILD_PYTHON = "ON"

[tool.scikit-build.metadata.version]
input = "VERSION"
provider = "scikit_build_core.metadata.regex"
regex = "(?P<value>.+)"

[project.urls]
Homepage = "https://github.com/ashvardanian/SmashTable"
Repository = "https://github.com/ashvardanian/SmashTable.git"

# Groups rather than extras, so pytest stays out of the published wheel's metadata.
[dependency-groups]
test = ["pytest>=8", "pytest-repeat", "pytest-run-parallel"]
lint = ["ruff>=0.15.8"]

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["*.py"]
testpaths = ["test"]
xfail_strict = true
markers = [
    "slow: the long threading soaks; deselect with -m 'not slow'",
    "thread_unsafe(reason): runs the test on one thread under pytest-run-parallel's --parallel-threads",
    "iterations(count): runs the test this many times under pytest-run-parallel, whatever --iterations says",
]

[tool.cibuildwheel]
test-command = "python -X faulthandler -m pytest -x {project}/test"
test-groups = ["test"]

# The stub sits beside the sources rather than inside a package, so a checker run against this
# repository is pointed at the directory holding it.
[tool.mypy]
mypy_path = "python"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["D", "I", "PT", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"!{python,test}/**" = ["D"]
# Tests owe a docstring on every module-level function (D103) and nothing else from pydocstyle.
"test/**" = ["D100", "D101", "D102", "D104", "D105", "D106", "D107", "D2", "D3", "D4"]

[tool.ruff.lint.isort]
known-first-party = ["smashtable"]
combine-as-imports = true

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smashtable"
version = "0.1.0"
description = "Safer associative containers with DBMS-like transactions in Python"
readme = "README.md"
authors = [{ name = "Ash Vardanian" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"

[tool.setuptools]
packages = []

[project.urls]
Homepage = "https://github.com/ashvardanian/SmashTable"
Repository = "https://github.com/ashvardanian/SmashTable.git"

# A group rather than an extra, so pytest stays out of the published wheel's metadata.
[dependency-groups]
test = ["pytest>=8", "pytest-repeat", "pytest-run-parallel"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-v"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["test"]
python_files = ["*.py"]
markers = ["slow: the long threading soaks; deselect with -m 'not slow'"]

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py312"
line-length = 120

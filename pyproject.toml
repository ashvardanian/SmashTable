[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smashtable"
version = "0.3.1"
description = "Safer associative containers with DBMS-like transactions in Python"
readme = "README.md"
authors = [{ name = "Ash Vardanian" }]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.12"

[tool.setuptools]
packages = []

[project.urls]
Homepage = "https://github.com/ashvardanian/SmashTable"
Repository = "https://github.com/ashvardanian/SmashTable.git"

# Groups rather than extras, so pytest stays out of the published wheel's metadata.
[dependency-groups]
test = ["pytest>=8", "pytest-repeat", "pytest-run-parallel"]
lint = ["ruff>=0.15.8"]

[tool.pytest.ini_options]
# `-p no:randomly` keeps `<PROJECT>_SEED` in charge wherever pytest-randomly happens to be installed.
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config", "-p", "no:randomly"]
filterwarnings = ["error"]
minversion = "8.0"
python_files = ["*.py"]
testpaths = ["test"]
xfail_strict = true
markers = ["slow: the long threading soaks; deselect with -m 'not slow'"]

[tool.cibuildwheel]
test-command = "python -X faulthandler -m pytest -x {project}/test"
test-groups = ["test"]

# The stub sits beside the sources rather than inside a package, so a checker run against this
# repository is pointed at the directory holding it.
[tool.mypy]
mypy_path = "python"

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["smashtable"]
combine-as-imports = true
